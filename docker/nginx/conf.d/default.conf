# Configuration du serveur Laravel

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/showme-access.log;
    error_log /var/log/nginx/showme-error.log;

    # Charset
    charset utf-8;

    # Gestion des fichiers statiques
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Sécurité: bloquer l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
    }

    # Routes dynamiques pour Livewire et Flux (priorité haute)
    location ~ ^/(livewire|flux)/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Route principale Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Configuration PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Optimisations
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Cache des fichiers statiques (sauf livewire/flux)
    location ~* ^/(?!livewire|flux).*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
