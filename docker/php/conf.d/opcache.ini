; Configuration OPcache pour performance optimale en développement/production

; Activation d'OPcache
opcache.enable = 1
opcache.enable_cli = 1

; Mémoire allouée à OPcache (en MB)
opcache.memory_consumption = 256

; Nombre maximum de fichiers en cache
opcache.max_accelerated_files = 20000

; Validation des timestamps (désactiver en production pour plus de performance)
; En développement: 1 pour recharger automatiquement les fichiers modifiés
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Interned strings buffer
opcache.interned_strings_buffer = 16

; Fast shutdown
opcache.fast_shutdown = 1

; Performance
opcache.save_comments = 1
opcache.enable_file_override = 1
