# Configuration Docker pour Laravel 12 avec Livewire
# Optimisé pour le développement local avec support production

services:
  # Service PHP-FPM avec Nginx
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: showme-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www/html
      - ./docker/php/conf.d/laravel.ini:/usr/local/etc/php/conf.d/laravel.ini
      - ./docker/php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
    environment:
      - APP_NAME=${APP_NAME:-Laravel}
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - PHP_IDE_CONFIG=serverName=showme
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-showme}
      - DB_USERNAME=${DB_USERNAME:-showme}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=${CACHE_STORE:-redis}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-mailpit}
      - MAIL_PORT=${MAIL_PORT:-1025}
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      - postgres
      - redis
    networks:
      - showme-network

  # Service PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: showme-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-showme}
      POSTGRES_USER: ${DB_USERNAME:-showme}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - showme-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-showme}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service Redis
  redis:
    image: redis:7-alpine
    container_name: showme-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - showme-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service Node.js pour Vite (développement avec HMR)
  vite:
    image: node:20-alpine
    container_name: showme-vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_PORT=5173
    networks:
      - showme-network

  # Service Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: showme-queue
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.docker
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    environment:
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-showme}
      - DB_USERNAME=${DB_USERNAME:-showme}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=${CACHE_STORE:-redis}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
    depends_on:
      - postgres
      - redis
    networks:
      - showme-network

  # Service Mailpit (capture des emails en développement)
  mailpit:
    image: axllent/mailpit:latest
    container_name: showme-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - showme-network

# Volumes persistants
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  node-modules:
    driver: local

# Réseau pour la communication inter-conteneurs
networks:
  showme-network:
    driver: bridge
